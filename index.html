function addItem(p,code,qty,cat,desc='',included=false){let r=getRate(code,p);if(r&&qty>0)p.items.push({code,name:r.name,description:desc,category:cat,qty:+qty.toFixed(3),unit:r.unit,material:r.material,labor:r.labor,waste:!['ELE','PLB','FIR','MEP'].includes(code.slice(0,3)),included})}
function generateBOQ(p){ensureCounts(p);p.items=[];const G=gfa(p),A=Math.max(...Array.from({length:p.floors},(_,i)=>floorGFA(p,i+1))),F=p.floors,H=wallArea(p),commercial=p.use==='Commercial';
let concrete=G*(commercial?.21:.17)+Math.max(0,F-1)*A*.025;let rebar=G*(commercial?40:31)+Math.max(0,F-1)*A*4.5;let form=G*(commercial?2.8:2.3)+A*Math.max(0,F-1)*.35;addItem(p,'CON-001',concrete,'Structural','Footings, columns, beams and slabs allowance');addItem(p,'CON-002',G*.035,'Structural','Blinding / lean concrete allowance');addItem(p,'CON-003',rebar,'Structural','Reinforcing bars, preliminary tonnage');addItem(p,'CON-004',rebar*.012,'Structural','Tie wire');addItem(p,'CON-005',form,'Structural','Formwork contact area');let cementBags=concrete*9.5+G*.035*8.5;addItem(p,'CON-006',cementBags,'Structural','Informational material decomposition; cost is included in ready-mix/lean concrete composite. Validate mix design.',true);addItem(p,'CON-007',concrete*.50+G*.035*.50,'Structural','Informational material decomposition; cost is included in ready-mix/lean concrete composite. Validate mix design.',true);addItem(p,'CON-008',concrete*1.00+G*.035*0.95,'Structural','Informational material decomposition; cost is included in ready-mix/lean concrete composite. Validate mix design.',true);
let chb=H*12.5;addItem(p,'MAS-001',chb,'Masonry','4-in CHB equivalent wall area');addItem(p,'MAS-003',chb/100*1.05,'Masonry','Mortar allowance');addItem(p,'MAS-004',H*1.9,'Masonry','Plaster both sides / adjusted opening allowance');addItem(p,'MAS-005',chb/100*1.05,'Masonry','Informational material decomposition; mortar material cost is included in composite.',true);addItem(p,'MAS-006',H*1.9*.20,'Masonry','Informational material decomposition; plaster mortar cost is included in plastering composite.',true);
let roofA=A*(ROOFS[p.roof]?.slope||1.06);addItem(p,'ROO-001',roofA,'Roofing',ROOFS[p.roof]?.desc||'');addItem(p,'ROO-002',roofA*(ROOFS[p.roof]?.frame||7.2),'Roofing','Primary and secondary steel roof framing');addItem(p,'ROO-003',roofA,'Roofing','Foil / insulation');if(p.roof!=='Flat')addItem(p,'ROO-004',Math.sqrt(A)*4*.9,'Roofing','Gutter and downspout allowance');if(p.roof!=='Flat'){addItem(p,'ROO-005',roofA*6.5,'Roofing','Roofing fasteners');addItem(p,'ROO-006',Math.sqrt(A)*2.2,'Roofing','Ridge / flashing allowance')}
let win=p.rooms.reduce((s,r)=>s+num(r.windows),0);let main=p.rooms.filter(r=>r.type==='Main Door').length||1;let intDoors=p.rooms.filter(r=>['Bedroom','Kitchen','Living Room','Dining','Office','Utility','Storage'].includes(r.type)).length;let crs=p.rooms.filter(r=>r.type==='CR').length;addItem(p,'ARC-001',Math.max(1,win*1.65),'Architectural','Window area based on room openings');addItem(p,'ARC-002',main,'Architectural','Main entrance doors');addItem(p,'ARC-003',intDoors,'Architectural','Interior flush doors');addItem(p,'ARC-004',crs,'Architectural','CR doors');
let floorAreas={};p.rooms.forEach(r=>floorAreas[r.finish]=(floorAreas[r.finish]||0)+roomArea(r));for(const [finish,area] of Object.entries(floorAreas)){if(finish!=='Cement')addItem(p,'FIN-001',area,'Finishes',finish+' floor finish');addItem(p,'FIN-002',area,'Finishes','Adhesive and grout')}let wet=p.rooms.filter(r=>r.type==='CR'||r.type==='Kitchen').reduce((s,r)=>s+roomArea(r)*1.6,0);addItem(p,'FIN-003',wet,'Finishes','Wet-area wall tile');
addItem(p,'FIN-004',H*1.55,'Finishes','Interior paint system');addItem(p,'FIN-011',H*1.55,'Finishes','Informational paint system decomposition; cost is included in interior paint composite.',true);addItem(p,'FIN-012',H*1.55,'Finishes','Informational paint system decomposition; cost is included in interior paint composite.',true);addItem(p,'FIN-005',Math.max(H*.45,A*.75),'Finishes','Exterior paint system');let ceilArea=p.rooms.reduce((s,r)=>s+roomArea(r),0);addItem(p,'FIN-006',ceilArea,'Finishes',p.ceiling+' ceiling');addItem(p,'FIN-010',ceilArea,'Finishes','Informational ceiling framing decomposition; cost is included in ceiling composite.',true);
let kitchen=p.rooms.filter(r=>r.type==='Kitchen').reduce((s,r)=>s+Math.max(r.l,r.w),0);addItem(p,'FIN-007',kitchen,'Finishes','Kitchen countertop linear length');addItem(p,'FIN-008',kitchen,'Finishes','Base and overhead kitchen cabinet linear length');let beds=p.rooms.filter(r=>r.type==='Bedroom').length;addItem(p,'FIN-009',beds*2.4,'Finishes','Wardrobe allowance');
let points=Math.max(1,Math.round(G/8));addItem(p,'ELE-001',points,'Electrical','General circuit/wiring points');addItem(p,'ELE-007',G*2.8,'Electrical','Informational conduit decomposition; cost is included in circuit point composite.',true);addItem(p,'ELE-008',G*8.0,'Electrical','Informational copper wire decomposition; final circuits require electrical design. Cost is included in circuit point composite.',true);addItem(p,'ELE-002',Math.max(1,p.rooms.length+2),'Electrical','Lighting points');addItem(p,'ELE-003',Math.max(4,Math.round(G/12)),'Electrical','Convenience outlets');addItem(p,'ELE-004',Math.max(1,Math.ceil(p.rooms.length/2)),'Electrical','Data/TV outlets');addItem(p,'ELE-005',commercial?Math.max(1,Math.ceil(G/180)):Math.max(1,Math.ceil(G/150)),'Electrical','Panelboards');addItem(p,'ELE-006',1,'Electrical','Service entrance and grounding allowance');
let fixtures=p.rooms.filter(r=>r.type==='CR').length;addItem(p,'PLB-001',Math.max(30,G*.55+fixtures*8),'Plumbing','Water supply and sanitary piping');addItem(p,'PLB-002',fixtures,'Plumbing','Water closets');addItem(p,'PLB-003',fixtures,'Plumbing','Lavatories');addItem(p,'PLB-004',fixtures,'Plumbing','Shower sets');addItem(p,'PLB-005',p.rooms.filter(r=>r.type==='Kitchen').length,'Plumbing','Kitchen sinks');addItem(p,'PLB-006',fixtures+1,'Plumbing','Floor drains');addItem(p,'PLB-007',1,'Plumbing','Septic tank allowance');
if(commercial){addItem(p,'FIR-001',Math.max(4,Math.ceil(G/40)),'Fire / life safety','Fire alarm points');addItem(p,'FIR-002',Math.max(2,Math.ceil(G/100)),'Fire / life safety','Fire extinguishers')}else{addItem(p,'FIR-002',Math.max(1,Math.ceil(G/150)),'Fire / life safety','Fire extinguisher allowance')}
if(p.use==='Commercial'||G>120)addItem(p,'MEP-001',Math.max(1,Math.ceil(G/35)),'Mechanical','Split-type HVAC allowance');addItem(p,'SITE-001',A*.20,'Site works','Concrete apron / paving allowance');addItem(p,'SITE-002',A*.05*.15,'Site works','Gravel/basecourse');addItem(p,'SITE-003',Math.sqrt(A)*1.5,'Site works','Drainage allowance');p.specials=p.specials||{};p.specials.prelim={mobilization:p.prelim?.mobilization??2.5,temporary:p.prelim?.temporary??2.0,permits:p.prelim?.permits??1.0,demobilization:p.prelim?.demobilization??1.0,groundbreaking:!!p.prelim?.groundbreaking,groundbreakingCost:num(p.prelim?.groundbreakingCost||30000)};p.generatedAt=new Date().toISOString();let snap=calc(p);p.estimateHistory=p.estimateHistory||[];p.estimateHistory.push({date:p.generatedAt,total:+snap.grand.toFixed(2),direct:+snap.direct.toFixed(2),gfa:+gfa(p).toFixed(2),perSqm:+(snap.grand/Math.max(1,gfa(p))).toFixed(2),finish:p.finish,province:p.province});if(p.estimateHistory.length>12)p.estimateHistory=p.estimateHistory.slice(-12);saveCurrent(false)}
function calc(p){let mat=0,lab=0;for(const i of p.items||[]){if(i.included)continue;let w=i.waste?1+num(p.waste)/100:1;mat+=i.qty*i.material*w;lab+=i.qty*i.labor}let direct=mat+lab;let pre=p.prelim||{};let mobilization=direct*num(pre.mobilization??2.5)/100;let temporary=direct*num(pre.temporary??2)/100;let permits=direct*num(pre.permits??1)/100;let demobilization=direct*num(pre.demobilization??1)/100;let groundbreaking=pre.groundbreaking?num(pre.groundbreakingCost||30000):0;let prelim=mobilization+temporary+permits+demobilization+groundbreaking;let cont=direct*num(p.contingency??8)/100;let miscBase=direct+prelim+cont;let misc=miscBase*num(p.misc??5)/100;let profitBase=miscBase+misc;let profit=profitBase*num(p.profit??p.markup??10)/100;let subtotal=profitBase+profit;let vat=p.applyVAT?subtotal*num(p.vat??12)/100:0;return{mat,lab,direct,mobilization,temporary,permits,demobilization,groundbreaking,prelim,cont,misc,profit,subtotal,vat,grand:subtotal+vat}}
function saveCurrent(show=true){if(!state.project)return;let ix=state.projects.findIndex(x=>x.id===state.project.id);if(ix<0)state.projects.push(structuredClone(state.project));else state.projects[ix]=structuredClone(state.project);localStorage.setItem('japz_projects_v5',JSON.stringify(state.projects));if(show)toast('Project saved')}
function select(id,label,opts,val){return `<div class="field"><label>${label}</label><select id="${id}">${opts.map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}

function lineChart(p){let h=(p.estimateHistory||[]).slice(-12);if(h.length<2)return '<div class="notice">Generate the BOQ at least twice to build a project cost history. The chart stores the last 12 generated estimates locally.</div>';let W=900,H=240,pad=35,vals=h.map(x=>x.total),min=Math.min(...vals),max=Math.max(...vals),span=Math.max(1,max-min);let pts=h.map((x,i)=>{let xx=pad+i*(W-2*pad)/Math.max(1,h.length-1),yy=H-pad-(x.total-min)/span*(H-2*pad);return [xx,yy]});return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#d8d3ca"/><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="#d8d3ca"/><polyline points="${pts.map(q=>q.join(',')).join(' ')}" fill="none" stroke="#b49355" stroke-width="4"/>${pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="#24262a"><title>${new Date(h[i].date).toLocaleDateString()} — ${money(h[i].total)}</title></circle>`).join('')}</svg></div>`}
function derivationTable(p){let rows=(p.items||[]).filter(i=>!i.included);return `<div class="tablewrap"><table class="table derivation"><thead><tr><th>Code</th><th>Item</th><th>Qty</th><th>Unit</th><th>Material/unit</th><th>Labor/unit</th><th>Waste</th><th>Material ext.</th><th>Labor ext.</th><th>Unit cost</th><th>Total</th></tr></thead><tbody>${rows.map(i=>{let w=i.waste?1+num(p.waste)/100:1,me=i.qty*i.material*w,le=i.qty*i.labor,uc=i.material*w+i.labor;return `<tr><td>${i.code}</td><td>${esc(i.name)}</td><td>${i.qty.toLocaleString()}</td><td>${i.unit}</td><td>${money(i.material)}</td><td>${money(i.labor)}</td><td>${i.waste?p.waste+'%':'—'}</td><td>${money(me)}</td><td>${money(le)}</td><td><b>${money(uc)}</b></td><td class="right"><b>${money(me+le)}</b></td></tr>`}).join('')}</tbody></table></div>`}

function projects(){return `<div class="head"><div><div class="eyebrow">Portfolio</div><h1>Projects</h1></div><button class="btn primary" data-a="new">+ New Project</button></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Project</th><th>Location</th><th>Use</th><th>Storeys</th><th>GFA</th><th>Estimate</th><th></th></tr></thead><tbody>${state.projects.map((p,i)=>{let t=p.items?.length?calc(p):{grand:0};return `<tr><td><b>${esc(p.name)}</b><br><span class="muted">${esc(p.client)}</span></td><td>${esc(p.province)}</td><td>${p.use}</td><td>${p.floors}</td><td>${gfa(p).toFixed(1)} m²</td><td>${money(t.grand)}</td><td><button class="btn" data-open="${i}">Open</button> <button class="btn danger" data-del="${i}">Delete</button></td></tr>`}).join('')||`<tr><td colspan="7"><div class="empty">No projects yet.</div></td></tr>`}</tbody></table></div></div>`}
function estimate(){let p=normalizeProject(state.project);if(!p)return `<div class="empty">Create a project first.</div>`;let t=p.items.length?calc(p):{direct:0,cont:0,profit:0,misc:0,prelim:0,grand:0};return `<div class="head"><div><div class="eyebrow">Detailed estimator</div><h1>${esc(p.name)}</h1><div class="muted">${esc(p.province)} • ${p.use} • ${p.floors} storey(s)</div></div><div class="actions"><button class="btn" data-a="save">Save</button><button class="btn primary" data-a="generate">Generate / Recalculate BOQ</button></div></div><div class="grid4"><div class="kpi"><small>Direct cost</small><strong>${money(t.direct)}</strong></div><div class="kpi"><small>Preliminaries</small><strong>${money(t.prelim)}</strong></div><div class="kpi"><small>Miscellaneous</small><strong>${money(t.misc)}</strong></div><div class="kpi"><small>Contractor profit</small><strong>${money(t.profit)}</strong></div></div><div class="section grid2"><div class="card"><div class="pad"><h3>Project & location</h3>${input('pname','Project name',p.name)}${input('client','Client',p.client)}${select('region','Region',Object.keys(REGIONS),p.region)}${select('province','Province / HUC',LOCS[p.region]||[],p.province)}${input('city','City / Municipality',p.city)}${select('siteAccess','Site access / logistics',['Urban','Suburban','Rural','Remote / Island'],p.siteAccess||'Urban')}<div class="grid2">${select('use','Use',['Residential','Commercial'],p.use)}${select('type','Building type',['Single House','Duplex','Apartment','Townhouse','Office','Retail','Restaurant','Institutional','Warehouse'],p.type)}</div><div class="section"><h3 style="margin:0 0 8px">Quick space counts</h3><div class="grid4">${['mainDoors','cr','bedrooms','kitchens','living','dining','office'].map(k=>input('count_'+k,k==='mainDoors'?'Main doors':k.charAt(0).toUpperCase()+k.slice(1),p.counts?.[k]||0,'number','1')).join('')}</div></div><div class="notice">Location factor: <b>${locFactor(p).toFixed(3)}×</b> • Price escalation factor: <b>${priceFactor(p).toFixed(3)}×</b>. Planning adjustment; verify local supplier quotations.</div></div></div><div class="card"><div class="pad"><h3>Pricing & business controls</h3><div class="grid3">${input('priceYear','Price year',p.priceYear,'number','1')}${input('inflationRate','Annual inflation %',p.inflationRate,'number','.1')}${input('marketAdjustment','Market price adjustment %',p.marketAdjustment,'number','.1')}</div><div class="grid3">${input('waste','Waste %',p.waste,'number','.1')}${input('cont','Contingency %',p.contingency,'number','.1')}${input('misc','Miscellaneous %',p.misc,'number','.1')}</div><div class="grid3">${input('profit','Contractor profit %',p.profit,'number','.1')}${input('vat','VAT %',p.vat,'number','.1')}<div class="field"><label>Apply VAT</label><input id="vatcheck" type="checkbox" ${p.applyVAT?'checked':''}></div></div><div class="notice"><b>Inflation engine:</b> 2026 is the base-rate year. Changing price year, inflation or market adjustment changes material/labor rates when you regenerate the BOQ.</div><h3 style="margin-top:15px">General requirements</h3><div class="grid4">${input('mobilization','Mobilization %',p.prelim.mobilization,'number','.1')}${input('temporary','Temporary facilities %',p.prelim.temporary,'number','.1')}${input('permits','Permits / clearances %',p.prelim.permits,'number','.1')}${input('demobilization','Demobilization %',p.prelim.demobilization,'number','.1')}</div><div class="grid2">${input('groundbreakingCost','Groundbreaking ceremony ₱',p.prelim.groundbreakingCost,'number','1000')}<div class="field"><label>Optional groundbreaking ceremony</label><input id="groundbreaking" type="checkbox" ${p.prelim.groundbreaking?'checked':''}></div></div></div></div></div><div class="section card"><div class="pad"><h3>Floor elevations & areas</h3><div class="tablewrap"><table class="table"><thead><tr><th>Floor</th><th>Floor-to-floor height</th><th>Target GFA</th><th>Room area</th><th>Difference / circulation</th></tr></thead><tbody>${Array.from({length:p.floors},(_,i)=>{let f=i+1,lv=p.levels[i]||{height:3};return `<tr><td><b>Floor ${f}</b></td><td><select class="level-height" data-floor="${f}">${[2.7,2.8,3,3.3,3.6,4,4.5,5].map(x=>`<option value="${x}" ${num(lv.height)===x?'selected':''}>${x.toFixed(1)} m</option>`).join('')}</select></td><td><input class="level-gfa" data-floor="${f}" type="number" step=".1" value="${lv.gfa||''}" placeholder="Auto"></td><td>${totalRoomArea(p,f).toFixed(1)} m²</td><td>${(floorGFA(p,f)-totalRoomArea(p,f)).toFixed(1)} m²</td></tr>`}).join('')}</tbody></table></div></div></div><div class="section card"><div class="pad"><div class="head" style="margin-bottom:10px"><div><h3 style="margin:0">Room / space schedule</h3><div class="muted small">Actual dimensions drive quantities.</div></div><button class="btn" data-a="room">+ Add space</button></div>${p.rooms.map((r,i)=>roomRow(r,i)).join('')}</div></div>`}
function roomRow(r,i){let types=['Living Room','Dining','Kitchen','Bedroom','CR','Main Door','Office','Utility','Storage','Garage','Balcony','Stair','Corridor'];return `<div class="room-card"><div class="room-grid"><div class="mini wide"><label>Name</label><input data-r="${i}" data-k="name" value="${esc(r.name)}"></div><div class="mini"><label>Floor</label><select data-r="${i}" data-k="floor">${Array.from({length:state.project.floors},(_,n)=>`<option value="${n+1}" ${r.floor===n+1?'selected':''}>${n+1}</option>`).join('')}</select></div><div class="mini"><label>Type</label><select data-r="${i}" data-k="type">${types.map(x=>`<option ${x===r.type?'selected':''}>${x}</option>`).join('')}</select></div><div class="mini"><label>Length m</label><input type="number" step=".1" data-r="${i}" data-k="l" value="${r.l}"></div><div class="mini"><label>Width m</label><input type="number" step=".1" data-r="${i}" data-k="w" value="${r.w}"></div><div class="mini"><label>Floor finish</label><select data-r="${i}" data-k="finish">${Object.keys(FLOORS).map(x=>`<option ${x===r.finish?'selected':''}>${x}</option>`).join('')}</select></div><div class="mini"><label>Ceiling</label><select data-r="${i}" data-k="ceiling">${Object.keys(CEILINGS).map(x=>`<option ${x===r.ceiling?'selected':''}>${x}</option>`).join('')}</select></div><div class="mini"><label>Windows</label><input type="number" min="0" step="1" data-r="${i}" data-k="windows" value="${r.windows}"></div><div class="mini"><label>Door</label><select data-r="${i}" data-k="door"><option ${r.door==='Interior'?'selected':''}>Interior</option><option ${r.door==='CR'?'selected':''}>CR</option><option ${r.door==='Main'?'selected':''}>Main</option><option ${r.door==='None'?'selected':''}>None</option></select></div><div class="mini"><label>Area</label><div class="room-total">${roomArea(r).toFixed(2)} m²</div></div><div class="mini"><button class="btn danger" data-room-del="${i}">Remove</button></div></div></div>`}
function boq(){let p=normalizeProject(state.project);if(!p)return `<div class="empty">Open a project first.</div>`;let t=calc(p);return `<div class="head"><div><div class="eyebrow">Quantity takeoff + cost build-up</div><h1>Detailed BOQ & Estimate</h1><div class="muted">Generated ${p.generatedAt?new Date(p.generatedAt).toLocaleString():'not yet'}</div></div><div class="actions"><button class="btn primary" data-a="generate">Regenerate from current inputs</button><button class="btn" data-a="csv">Export CSV</button></div></div><div class="grid4"><div class="kpi"><small>Direct works</small><strong>${money(t.direct)}</strong></div><div class="kpi"><small>General requirements</small><strong>${money(t.prelim)}</strong></div><div class="kpi"><small>Profit + misc.</small><strong>${money(t.profit+t.misc)}</strong></div><div class="kpi"><small>Total project</small><strong>${money(t.grand)}</strong></div></div><div class="section grid2"><div class="card"><div class="pad"><h3>General requirements</h3>${[['Mobilization',t.mobilization,p.prelim.mobilization+'% of direct'],['Temporary facilities',t.temporary,p.prelim.temporary+'% of direct'],['Permits / clearances',t.permits,p.prelim.permits+'% of direct'],['Demobilization',t.demobilization,p.prelim.demobilization+'% of direct'],['Groundbreaking ceremony',t.groundbreaking,p.prelim.groundbreaking?'Optional — included':'Optional — excluded']].map(x=>`<div class="sumrow"><span>${x[0]} <small class="muted">(${x[2]})</small></span><b>${money(x[1])}</b></div>`).join('')}<div class="sumrow total"><span>Total general requirements</span><b>${money(t.prelim)}</b></div></div></div><div class="card"><div class="pad"><h3>Business cost build-up</h3><div class="sumrow"><span>Direct works</span><b>${money(t.direct)}</b></div><div class="sumrow"><span>Contingency (${p.contingency}%)</span><b>${money(t.cont)}</b></div><div class="sumrow"><span>Miscellaneous (${p.misc}%)</span><b>${money(t.misc)}</b></div><div class="sumrow"><span>Contractor profit (${p.profit}%)</span><b>${money(t.profit)}</b></div><div class="sumrow"><span>VAT (${p.applyVAT?p.vat+'%':'not applied'})</span><b>${money(t.vat)}</b></div><div class="sumrow total"><span>Total project cost</span><b>${money(t.grand)}</b></div></div></div></div><div class="section card"><div class="pad"><h3>Unit Cost Derivation — Detailed</h3><p class="muted small">Material extension = quantity × adjusted material rate × waste. Labor extension = quantity × adjusted labor rate. Unit cost = adjusted material rate + waste + labor.</p>${derivationTable(p)}</div></div><div class="section card"><div class="pad"><h3>Historical project costing</h3>${lineChart(p)}<div class="source-note">This chart is your project's own saved costing history, not a market index.</div></div></div><div class="section card"><div class="pad"><h3>Detailed BOQ</h3><div class="tablewrap"><table class="table"><thead><tr><th>Code</th><th>Category</th><th>Detailed item</th><th>Qty</th><th>Unit</th><th>Material rate</th><th>Labor rate</th><th>Waste</th><th>Amount</th></tr></thead><tbody>${p.items.map(i=>{let w=i.waste?1+num(p.waste)/100:1,a=i.included?0:i.qty*(i.material*w+i.labor);return `<tr><td>${i.code}</td><td><span class="pill">${esc(i.category)}</span></td><td><b>${esc(i.name)}</b><br><span class="muted small">${esc(i.description)}</span></td><td>${i.qty.toLocaleString()}</td><td>${i.unit}</td><td>${money(i.material)}</td><td>${money(i.labor)}</td><td>${i.waste?p.waste+'%':'—'}</td><td class="right"><b>${i.included?'Included':money(a)}</b></td></tr>`}).join('')}</tbody></table></div></div></div><div class="notice" style="margin-top:12px">The default annual escalation is based on the latest PSA NCR CMRPI reference available in the app build; local supplier quotes and project-specific escalation can differ.</div>`}
function visuals(){let cats=[['Exterior','Facade'],['Roof','Roof'],['Floor','Floor'],['Ceiling','Ceiling'],['Kitchen','Kitchen'],['Bathroom','Bathroom'],['Doors & Windows','Openings'],['Lighting','Lighting'],['Wall Finish','Walls']];let styles=[['Bare / Basic','Basic / Bare Finish','visual-basic.png'],['Modern / Standard','Standard / Modern','visual-standard.png'],['Luxury','Luxury','visual-luxury.png']];return `<div class="head"><div><div class="eyebrow">Client reference</div><h1>Visual Finish Guide</h1><div class="muted">AI-generated photographic reference images replace the old placeholder drawings. They are visual guides, not construction specifications.</div></div></div><div class="card"><div class="pad"><h3>Photographic finish references</h3><p class="muted small">Use these images to compare finish character before selecting the corresponding estimator options.</p></div></div>${cats.map(c=>`<div class="section"><h3>${c[0]}</h3><div class="visual-grid">${styles.map(st=>`<div class="visual-card"><div class="art"><img class="visual-photo" src="./${st[2]}" alt="${esc(st[1])} ${esc(c[0])} reference"></div><div class="cap"><em>${st[0]}</em><b>${c[0]}</b><small>${visualDesc(c[1],st[0])}</small></div></div>`).join('')}</div></div>`).join('')}`}
function visualCard(cat,style,key){return `<div class="visual-card"><div class="art">${svgScene(cat,style)}</div><div class="cap"><em>${style}</em><b>${cat}</b><small>${visualDesc(cat,style)}</small></div></div>`}
function visualDesc(cat,style){let m={'Basic / Bare Finish':'unfinished or budget-level materials, simple forms and practical fixtures','Standard / Modern':'clean contemporary finishes, durable mid-range materials and coordinated details','Luxury':'premium finishes, layered lighting, refined joinery and higher-spec materials'};return m[style]||''}
function svgScene(cat,style){let lux=style==='Luxury',modern=style==='Modern / Standard';let wall=lux?'#d9d0c3':modern?'#e8e3da':'#d0cbc0',floor=lux?'#8b8176':modern?'#aaa49b':'#9a948a',trim=lux?'#8f6f3f':modern?'#444':'#555';let common=`<rect width="100%" height="100%" fill="#dfe7e8"/><rect y="125" width="100%" height="85" fill="${floor}"/><rect x="25" y="35" width="270" height="110" rx="4" fill="${wall}"/><rect x="45" y="55" width="75" height="55" fill="#9db8c4"/><rect x="200" y="55" width="65" height="55" fill="#9db8c4"/>`;let extra='';if(cat==='Roof')extra=`<polygon points="20,45 155,10 300,45 270,62 155,35 50,62" fill="${lux?'#303238':modern?'#4b4d50':'#777'}"/><line x1="45" y1="62" x2="155" y2="35" stroke="#ddd" stroke-width="2"/><line x1="155" y1="35" x2="270" y2="62" stroke="#ddd" stroke-width="2"/>`;if(cat==='Floor')extra=`<g stroke="${trim}" stroke-width="1" opacity=".7"><path d="M0 155H330M0 180H330M40 125V210M110 125V210M180 125V210M250 125V210"/></g><rect x="75" y="72" width="180" height="48" fill="#fff" opacity=".7"/>`;if(cat==='Ceiling')extra=`<rect x="35" y="35" width="260" height="38" fill="${lux?'#b89f77':modern?'#f3f1eb':'#c7c1b4'}"/><g stroke="#777" opacity=".5"><line x1="35" y1="54" x2="295" y2="54"/><line x1="90" y1="35" x2="90" y2="73"/><line x1="155" y1="35" x2="155" y2="73"/><line x1="220" y1="35" x2="220" y2="73"/></g>${lux?'<circle cx="155" cy="54" r="9" fill="#f7d98c"/>':''}`;if(cat==='Kitchen')extra=`<rect x="45" y="110" width="240" height="30" fill="${lux?'#4c423a':modern?'#70736e':'#888'}"/><rect x="55" y="75" width="215" height="35" fill="${lux?'#c6b39a':modern?'#d9d8d2':'#b6b0a4'}"/><rect x="70" y="125" width="55" height="45" fill="#777"/><rect x="145" y="125" width="55" height="45" fill="#777"/>`;if(cat==='Bathroom')extra=`<rect x="55" y="65" width="210" height="85" fill="${lux?'#e7e0d4':modern?'#ddd':'#c8c4bc'}"/><rect x="80" y="80" width="45" height="35" fill="#b7ccd1"/><rect x="155" y="80" width="60" height="35" fill="#fff"/><rect x="150" y="120" width="50" height="18" rx="9" fill="#ddd"/>`;if(cat==='Doors & Windows')extra=`<rect x="65" y="55" width="55" height="90" fill="#5b4737"/><rect x="190" y="55" width="70" height="70" fill="#9ec0cc" stroke="${trim}" stroke-width="5"/><circle cx="108" cy="100" r="3" fill="#d9c27c"/>`;if(cat==='Lighting')extra=`<rect x="55" y="40" width="220" height="55" fill="#f5f2ea"/>${lux?'<circle cx="110" cy="68" r="12" fill="#f6d98e"/><circle cx="220" cy="68" r="12" fill="#f6d98e"/>':modern?'<circle cx="165" cy="68" r="14" fill="#f2df9e"/>':'<circle cx="165" cy="68" r="8" fill="#f0e7bf"/>'}`;if(cat==='Walls')extra=`<rect x="35" y="35" width="260" height="110" fill="${wall}"/><rect x="48" y="50" width="100" height="80" fill="${lux?'#75685b':modern?'#b2b0a7':'#9e9a92'}"/><rect x="170" y="50" width="100" height="80" fill="${lux?'#d8c4a5':modern?'#d9d6ce':'#c9c4ba'}"/>`;if(cat==='Facade')extra=`<polygon points="35,65 155,25 290,65 275,78 155,48 50,78" fill="${lux?'#34383a':modern?'#5b5e60':'#70706b'}"/><rect x="70" y="78" width="55" height="65" fill="#8faeb7"/><rect x="170" y="78" width="70" height="65" fill="#8faeb7"/><rect x="145" y="103" width="20" height="40" fill="#5b4737"/>`;return `<svg viewBox="0 0 330 210" xmlns="http://www.w3.org/2000/svg">${common}${extra}<rect x="0" y="0" width="330" height="210" fill="none" stroke="#fff" stroke-opacity=".35"/></svg>`}
function ai(){let p=normalizeProject(state.project);if(!p)return `<div class="empty">Create a project first.</div>`;let issues=[],G=gfa(p),t=p.items.length?calc(p):calc({...p,items:[]}),ep=G?t.grand/G:0,psab=p.use==='Commercial'?PSA_BENCHMARK.nonresidential:PSA_BENCHMARK.residential;if(p.rooms.filter(r=>r.type==='CR').length===0)issues.push('No CR entered; sanitary fixture and plumbing quantities may be incomplete.');if(p.rooms.filter(r=>r.type==='Kitchen').length===0&&p.use==='Residential')issues.push('No kitchen entered; cabinet, countertop and sink quantities may be understated.');if(p.roof==='Flat')issues.push('Confirm roof deck, waterproofing, drainage and overflow design.');if(p.levels.some(x=>num(x.height)>=3.6))issues.push('High floor elevation increases wall finish, scaffolding and potentially MEP costs.');if(locFactor(p)!==1)issues.push('Location/logistics factor is materially affecting rates; validate with local delivered quotations.');if(ep>psab*1.45)issues.push('Estimate is substantially above the national permit benchmark; inspect premium finishes, quantities, logistics and overhead assumptions.');if(ep<psab*.70)issues.push('Estimate is substantially below the national permit benchmark; check structural, MEP, site and finish scope.');let rec=[];if(p.finish==='Luxury')rec.push('Compare Luxury against Standard / Modern and identify finish items that can be downgraded without changing the room layout.');if(p.roof==='Mansard')rec.push('Compare Mansard with Hip or Gable because roof geometry affects framing, flashing and installation quantities.');if(p.ceiling==='Plain Wood')rec.push('Use Plain Wood selectively in feature areas and compare PVC/fiber-cement rates for secondary spaces.');if(p.siteAccess==='Remote / Island')rec.push('Use delivered-to-site supplier quotations and consolidate procurement to reduce repeated freight and handling.');if(t.prelim>t.direct*.07)rec.push('General requirements exceed 7% of direct works; review mobilization, temporary facilities, permits and demobilization assumptions.');if(!rec.length)rec.push('Compare at least two current supplier quotations for major material groups and update the market adjustment before tender.');let gap=psab?((ep/psab)-1)*100:0;let prompt=aiPrompt(p,t,issues,rec);return `<div class="head"><div><div class="eyebrow">AI estimating assistant</div><h1>AI Advisory & Cost Analysis</h1><div class="muted">Rule-based checks plus a ready-to-send ChatGPT project analysis prompt.</div></div><div class="actions"><button class="btn" data-a="copy-prompt">Copy AI Prompt</button><button class="btn primary" data-a="ask-chatgpt">Ask ChatGPT</button><button class="btn" data-a="generate">Recalculate</button></div></div><div class="grid4"><div class="kpi"><small>Estimated ₱/m²</small><strong>${money(ep)}</strong></div><div class="kpi"><small>PSA benchmark</small><strong>${money(psab)}</strong></div><div class="kpi"><small>Benchmark difference</small><strong>${gap>=0?'+':''}${gap.toFixed(1)}%</strong></div><div class="kpi"><small>Price factor</small><strong>${priceFactor(p).toFixed(3)}×</strong></div></div><div class="section grid2"><div class="card"><div class="pad"><h3>Economic / pricing recommendations</h3>${rec.map(x=>`<div class="notice" style="margin-bottom:8px">${esc(x)}</div>`).join('')}<p class="muted small">The local review identifies cost drivers and possible savings; ChatGPT can expand the analysis when given the generated prompt and current market information.</p></div></div><div class="card"><div class="pad"><h3>Risk / completeness checks</h3>${(issues.length?issues:['No major input gaps detected.']).map(x=>`<div class="notice" style="margin-bottom:8px">${esc(x)}</div>`).join('')}</div></div></div><div class="section card"><div class="pad"><h3>ChatGPT analysis prompt</h3><div class="chat-note"><b>How it works:</b> Tap <b>Ask ChatGPT</b>. Japz copies the complete project prompt and opens ChatGPT in a new tab/app. Paste the prompt into the ChatGPT composer. This avoids exposing an OpenAI API key in a public browser app. ChatGPT can use web search for current information when appropriate. citeturn0search2turn0search3</div><textarea id="aiPrompt" class="ai-prompt" readonly>${esc(prompt)}</textarea></div></div><div class="section card"><div class="pad"><h3>Cost history & trend</h3>${lineChart(p)}</div></div><div class="section card"><div class="pad"><h3>Cost structure</h3>${[['Materials',t.mat],['Labor',t.lab],['Direct works',t.direct],['General requirements',t.prelim],['Contingency',t.cont],['Miscellaneous',t.misc],['Contractor profit',t.profit],['VAT',t.vat],['Total project',t.grand]].map(x=>`<div class="sumrow ${x[0]==='Total project'?'total':''}"><span>${x[0]}</span><b>${money(x[1])}</b></div>`).join('')}</div></div><p class="muted small">PSA July 2026 residential approved-permit average: ₱13,058.66/m². PSA August 2026 NCR CMRPI: 2.0% year-on-year. These are benchmarks/indices, not project quotations.</p></div>`}
function upgrade(){return `<div class="head"><div><div class="eyebrow">Professional edition</div><h1>Japz Project Estimator Pro</h1><div class="muted">Built for detailed project estimating and professional workflows.</div></div></div><div class="card pro-card"><div class="pad"><h2>7-day Pro trial</h2><p>Experience the detailed estimator before deciding whether to purchase Pro.</p><ul><li>Detailed room and floor schedule</li><li>Location-adjusted pricing</li><li>Detailed quantity takeoff</li><li>Roof, ceiling and finish options</li><li>AI review checks</li><li>Visual finish guide</li></ul>${trialActive()?`<div class="notice">Trial active: ${trialLeft()} day(s) remaining.</div>`:`<button class="btn primary" data-a="trial">Start free 7-day trial</button>`}</div></div>`}
function ratePage(){return `<div class="head"><div><div class="eyebrow">Pricing engine</div><h1>Rate Library</h1><div class="muted">Base planning rates with location and finish adjustments.</div></div></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Code</th><th>Item</th><th>Unit</th><th>Base Material</th><th>Base Labor</th><th>Current Location Factor</th><th>Adjusted Composite</th></tr></thead><tbody>${rates.map(r=>{let a=getRate(r.code,state.project||{region:'NCR',province:'Metro Manila',finish:'Standard / Modern'});return `<tr><td>${r.code}</td><td>${r.name}</td><td>${r.unit}</td><td>${money(r.material)}</td><td>${money(r.labor)}</td><td>${state.project?locFactor(state.project).toFixed(3):'1.000'}×</td><td>${money((a?.material||0)+(a?.labor||0))}</td></tr>`}).join('')}</tbody></table></div></div>`}
function render(){let nav=[['dashboard','Dashboard'],['projects','Projects'],['estimate','Estimator'],['boq','BOQ'],['ai','AI Advisor'],['visuals','Visual Guide'],['rates','Rate Library'],['upgrade','Pro']];let body=state.page==='dashboard'?dashboard():state.page==='projects'?projects():state.page==='estimate'?estimate():state.page==='boq'?boq():state.page==='ai'?ai():state.page==='visuals'?visuals():state.page==='rates'?ratePage():upgrade();document.getElementById('app').innerHTML=`<div class="app"><header class="top"><div class="brand"><div class="logo">J</div><div><b>Japz Project Estimator</b><small>Professional Philippine Cost Planning</small></div></div><span class="tag">${trialActive()?'PRO TRIAL':'FREE EDITION'}</span></header><div class="layout"><aside class="side">${nav.map(n=>`<button class="nav ${state.page===n[0]?'active':''}" data-page="${n[0]}">${n[1]}</button>`).join('')}</aside><main class="content">${body}</main></div></div>`}
function syncProjectInputs(){let p=normalizeProject(state.project);if(!p)return;const vals=['pname','client','city','use','type','region','province','siteAccess','roof','finish','ceiling','defaultFloor','roofPitch','floors','waste','cont','misc','profit','vat','priceYear','inflationRate','marketAdjustment'];for(const id of vals){let e=$(id);if(!e)continue;let v=e.value;if(['floors','waste','cont','misc','profit','vat','priceYear','inflationRate','marketAdjustment'].includes(id))v=Number(v);p[id==='pname'?'name':id==='cont'?'contingency':id]=v}p.counts=p.counts||{};for(const k of Object.keys(p.counts)){const e=$('count_'+k);if(e)p.counts[k]=Number(e.value)||0}p.applyVAT=$('vatcheck')?.checked||false;p.prelim.mobilization=Number($('mobilization')?.value)||0;p.prelim.temporary=Number($('temporary')?.value)||0;p.prelim.permits=Number($('permits')?.value)||0;p.prelim.demobilization=Number($('demobilization')?.value)||0;p.prelim.groundbreakingCost=Number($('groundbreakingCost')?.value)||0;p.prelim.groundbreaking=$('groundbreaking')?.checked||false;p.floors=Number(p.floors);if(p.levels.length<p.floors)while(p.levels.length<p.floors)p.levels.push({height:3});if(p.levels.length>p.floors)p.levels=p.levels.slice(0,p.floors);if(!LOCS[p.region]?.includes(p.province))p.province=LOCS[p.region]?.[0]||p.province}
function exportCSV(){let p=state.project;let rows=[['Code','Category','Item','Description','Qty','Unit','Material Rate','Labor Rate','Amount']];p.items.forEach(i=>{let w=i.waste?1+num(p.waste)/100:1;rows.push([i.code,i.category,i.name,i.description,i.qty,i.unit,i.material,i.labor,i.included?0:i.qty*(i.material*w+i.labor)])});let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=(p.name||'Japz-BOQ')+'.csv';a.click()}
document.addEventListener('change',e=>{let p=state.project;if(!p)return;if(e.target.matches('#region')){p.region=e.target.value;p.province=LOCS[p.region][0];render();return}if(e.target.matches('#province')){p.province=e.target.value;return}if(e.target.matches('.level-height')){p.levels[Number(e.target.dataset.floor)-1].height=Number(e.target.value);render();return}if(e.target.matches('.level-gfa')){let f=Number(e.target.dataset.floor);p.levels[f-1].gfa=Number(e.target.value)||null;render();return}if(e.target.id&&e.target.id.startsWith('count_')){p.counts=p.counts||{};p.counts[e.target.id.slice(6)]=Number(e.target.value)||0;render();return}if(e.target.matches('[data-r][data-k]')){let r=p.rooms[Number(e.target.dataset.r)],k=e.target.dataset.k;r[k]=['floor','windows'].includes(k)?Number(e.target.value):['l','w'].includes(k)?Number(e.target.value):e.target.value;render();return}if(e.target.id==='vatcheck'){p.applyVAT=e.target.checked;render()}});
document.addEventListener('click',e=>{let b=e.target.closest('button,.finish-choice');if(!b)return;if(b.classList.contains('finish-choice')){if(!state.project)return;state.project.finish=b.dataset.finish;render();return}if(b.dataset.page){state.page=b.dataset.page;render();return}let a=b.dataset.a;if(a==='new'){newProject();return}if(a==='trial'){startTrial();return}if(a==='open'){state.project=state.projects[0];state.page='estimate';render();return}if(a==='save'){syncProjectInputs();saveCurrent();return}if(a==='generate'){syncProjectInputs();generateBOQ(state.project);state.page='boq';render();toast('BOQ recalculated from current inputs');return}if(a==='copy-prompt'||a==='ask-chatgpt'){let el=document.getElementById('aiPrompt');if(!el){state.page='ai';render();el=document.getElementById('aiPrompt')}let txt=el?.value||'';navigator.clipboard?.writeText(txt).catch(()=>{});if(a==='ask-chatgpt'){window.open('https://chatgpt.com/','_blank','noopener,noreferrer');toast('AI prompt copied. Paste it into ChatGPT.')}else toast('AI prompt copied to clipboard');return}if(a==='room'){syncProjectInputs();state.project.rooms.push({id:Date.now(),floor:1,type:'Bedroom',name:'New Space',l:3,w:3,finish:state.project.defaultFloor,ceiling:state.project.ceiling,door:'Interior',windows:1});render();return}if(a==='csv'){exportCSV();return}if(b.dataset.open){state.project=state.projects[Number(b.dataset.open)];state.page='estimate';render();return}if(b.dataset.del){state.projects.splice(Number(b.dataset.del),1);localStorage.setItem('japz_projects_v5',JSON.stringify(state.projects));render();return}if(b.dataset.roomDel){state.project.rooms.splice(Number(b.dataset.roomDel),1);render();return}});
function boot(){if(!state.project&&state.projects[0])state.project=state.projects[0];render()}boot();
</script></body></html>
